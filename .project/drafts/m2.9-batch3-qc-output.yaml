  man_recheck:
    - "man fuser (fs_009) — проверено: -m трактует аргумент как имя файла ИЛИ точки монтирования и перечисляет PID процессов, использующих файлы на этой ФС; -k отправляет SIGKILL, то есть завершает процессы. Вывод: 'fuser -m /mnt/data' объективно верен и является каноничной диагностикой занятой точки монтирования (в RHEL диагностический идиом — fuser -m -v /mnt). Дистракторы: 'umount -f' форсирует размонтирование и PID-ов не печатает; 'fuser -k' убивает процессы (возврат 'fuser -m' + -k); 'lsof -i' фильтрует интернет-файлы по сетевому адресу вида [@host|:port], путь ФС в -i не принимается. Второго верного варианта нет."
    - "man lsof (fs_009) — проверено: -i [i] выбирает файлы по адресу интернет-соединения (host:port), а не по объекту ФС; каноничная форма для каталога — lsof +D <каталог>. Вывод: дистрактор неверен по назначению опции, независимо от версии сборки."
    - "man mkfs.fat / mkfs.vfat(8) dosfstools (fs_010) — проверено: -F FAT-SIZE задаёт разрядность FAT (12/16/32), то есть '-F 32' создаёт FAT32, а '-F 16' — FAT16; -c выполняет проверку на сбойные блоки ПЕРЕД созданием ФС и размер FAT не задаёт (тип выбирается автоматически, по размеру устройства); опции '-t' в mkfs.fat нет. Вывод: единственный объективно верный вариант — 'mkfs.vfat -F 32 /dev/sdc1' (только он даёт FAT32 независимо от размера, как требует стем). Остаточная неопределённость помечена в issues (см. MINOR по fs_010) и касается только силы обоснования дистрактора -c, а не единственности верного ответа."
    - "man showmount(8) (fs_011) — проверено: -e/--exports показывает список экспортов NFS-сервера (обращение к серверу по MOUNT-протоколу через rpc.mountd); -a/--all показывает клиентов и смонтированные ими каталоги в форме host:dir; -d показывает каталоги, смонтированные клиентами. Вывод: 'showmount -e nfs1' верен; дистрактор 'showmount -a nfs1' даёт список клиентов, а не экспортов."
    - "man exportfs(8) (fs_011) — проверено: exportfs -a экспортирует (или снимает с экспорта) ВСЕ записи /etc/exports НА ЛОКАЛЬНОМ (своём) хосте, -v добавляет подробный вывод; запросить список экспортов у удалённого nfs1 этой командой нельзя. Вывод: дистрактор объективно неверен."
    - "man rpcinfo(8) (fs_011) — проверено: rpcinfo -p [host] перечисляет RPC-программы, зарегистрированные на хосте вместе с номером порта. Список экспортируемых каталогов не выводится. Вывод: дистрактор объективно неверен."
    - "man mount(8) RHEL 9 util-linux (fs_012) — проверено: для монтирования образа как каталога используется опция -o loop (mount сам задействует loop-устройство через /dev/loop-control); 'loop' — опция монтирования, а не тип ФС, поэтому '-t loop' отвергается как неизвестный тип (записи 'loop' в /proc/filesystems нет, тип регистрируется именем 'iso9660' или иным); '-o bind' лишь накладывает существующий файл/каталог на другую точку и образ как ФС не интерпретирует. Вывод: единственный верный вариант — 'mount -o loop /root/rocky.iso /mnt/iso'."
    - "man losetup(8) (fs_012) — проверено: --detach отключает loop-устройство (при указании файла — те loop-устройства, которые с ним связаны). Монтирования не выполняет, содержимое в конкретной точке монтирования не появляется. Вывод: дистрактор объективно неверен."
    - "man tune2fs(8) (fs_013) — проверено: -c max-mount-counts задаёт порог числа монтирований, -C mount-count задаёт текущий счётчик монтирований (не порог), -i interval-between-checks задаёт максимальный интервал времени; суффиксы d/w/m = дни/недели/месяцы, при отсутствии суффикса значение в днях. E2fsck запускает проверку, когда превышен ЛЮБОЙ из порогов (число монтирований ИЛИ истёк интервал), что соответствует условию стема «в зависимости от того, что наступит раньше». Вывод: 'tune2fs -c 20 -i 30d /dev/sdb1' верен; -C 20 порога не задаёт; 30m = 30 месяцев и 30w = 30 недель дают другой интервал, чем 30 дней."
    - "man df(1) coreutils (fs_014) — проверено: -i/--inodes печатает статистику по инодам (Inodes, IUsed, IFree, IUse%); -h даёт размеры в человекочитаемых единицах, колонок инодов не содержит; -T/--print-type добавляет колонку типа ФС, иноды не показывает. Вывод: 'df -i /data' верен, дистракторы объективно неверны."
    - "man du(1) (fs_014) — проверено: du -s -h оценивает занятое дисковое пространство каталога (обход файлов), к инодам отношения не имеет и при исчерпании инодов ошибку создания файла не объясняет. Вывод: дистрактор объективно неверен."
    - "РЕ-АУДИТ man df(1) (новый стем fs_014) — проверено: df -i /srv/mail печатает для ФС, содержащей указанный путь, колонки Inodes, IUsed, IFree, IUse% — то есть прямо отвечает на вопрос «не исчерпаны ли иноды»; df -h /srv/mail печатает размер в человекочитаемых единицах (Size/Used/Avail/Use%) и колонок инодов не содержит — а стем уже сообщает, что по df -h место есть, значит опция повторяет уже известное и иноды не показывает; df -T /srv/mail добавляет колонку Type (тип ФС) и иноды не показывает. Второго верного варианта нет."
    - "РЕ-АУДИТ man du(1) (новый стем fs_014) — проверено: du -sh /srv/mail считает суммарный объём файлов под каталогом; это метрика ЗАНЯТОГО МЕСТА, а не числа инодов, и она в принципе не объясняет 'No space left on device' при исчерпании инодов (мелкие файлы занимают мало места, но каждый съедает инод). Дистрактор объективно неверен."
    - "РЕ-АУДИТ факта стема (fs_014) — проверено по знанию man df(1) и каноничной диагностики RHCSA: сочетание ошибки ENOSPC при создании множества мелких файлов и одновременно достаточного свободного места по df -h — классический признак исчерпания инодов (df -i показывает IUse% близким к 100%), поэтому сценарий стема физически корректен и диагностически однозначен. Проверка сценария live-командой запрещена капитаном (WSL/live-прогоны не выполнялись)."
  limitations:
    - "Live-прогоны команд RHCSA и WSL запрещены капитаном, поэтому man-страницы сверялись по знанию дистрибутивных man RHEL/Rocky 9 и через web_search. web_fetch в этой сессии заблокирован (любой хост, включая man7.org, manpages.ubuntu.com, manpages.debian.org, raw.githubusercontent.com, резолвится в непубличный IP), поэтому ТЕКСТ man-страниц прочитать не удалось: web_search возвращал только список источников без цитируемого текста. Все перечисленные выше пункты man_recheck подтверждены знанием man-страниц, а не пофрагментной сверкой текста; для dosfstools (mkfs.fat) — единственное место, где формулировка ключа -c и авто-выбор размера FAT важны для силы дистрактора, — это отражено как MINOR в issues."
    - "Рекомендация к следующему прогону QC: проверить доступность web_fetch или локального man-кэша, чтобы перевести man_recheck в режим пофрагментной сверки текста."
