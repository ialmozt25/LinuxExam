contract: qc_to_orchestrator
batch_id: "m2.9-batch3-file_systems"
verdict: PASS
reaudit: "РЕ-АУДИТ (второй проход QC). fs_014 переписан Writer'ом ПОСЛЕ первого отчёта: изменены ТОЛЬКО стем (было «Создание файла на разделе /data завершается ошибкой, хотя свободного места ещё достаточно» / стало «При записи множества мелких файлов в каталог /srv/mail появляется ошибка «No space left on device», хотя команда df -h показывает, что свободного места ещё достаточно») и пути в опциях (/data -> /srv/mail). id, topic, difficulty, objective_domain, subtopic, explanation, _meta.reference ('man df') не изменялись; остальные 5 вопросов не тронуты (индексы верных ответов совпадают с первым проходом: fs_009:0 fs_010:3 fs_011:1 fs_012:2 fs_013:0 fs_014:3). Все гейты перезапущены заново на обновлённом артефакте. CRITICAL по коллизии fs_014~ls_005 СНЯТ: cosine 0.8049 -> 0.6090 (ниже порога 0.80 на 0.191)."
verdict_basis: "Агрегат PASS по verdict_rules: hard blocker (fact-check / objective) не выявлен ни у одного из 6 вопросов; открытых CRITICAL нет — единственный CRITICAL первого прохода (коллизия fs_014~ls_005, кросс-темная пара > 0.80) разведён правкой стема и помечен resolved с повторно измеренным значением."
adversarial_note: "Позиция QC — adversarial. Ни один пункт evidence Writer не принят на веру: все гейты перезапущены самостоятельно, 6 вопросов извлечены из YAML в %TEMP% и прогнаны обоими режимами cosine, факты по 24 опциям сверены по man-страницам RHEL/Rocky 9."
questions:
  - question_id: fs_009
    verdict: accept
    passes:
      fact_check: pass
      objective: pass
      language: pass
      beginner_view: pass
      skeptic_view: pass
    hard_blocker_reason: null
    issues:
      - "Advisory MINOR: дистрактор 'lsof -i /mnt/data' отвергнут по неверному употреблению опции -i (lsof -i ожидает сетевой адрес). Поведение при неверном значении -i версионно-зависимо: часть сборок печатает usage и выходит, часть трактует как отсутствие фильтра и перечисляет сокеты. Ни в одном варианте путь ФС не фильтруется и PID-ы именно по /mnt/data не выводятся, поэтому второй верный вариант не возникает. Для диагностики занятой точки монтирования идиоматична связка lsof +D /mnt/data, а не -i."
  - question_id: fs_010
    verdict: accept
    passes:
      fact_check: pass
      objective: pass
      language: pass
      beginner_view: pass
      skeptic_view: pass
    hard_blocker_reason: null
    issues:
      - "Advisory MINOR (beginner-view): обоснование дистрактора 'mkfs.vfat -c /dev/sdc1' логически слабое. Ключ -c действительно лишь включает проверку на сбойные блоки и размер FAT не задаёт, но тип при этом выбирается автоматически ПО РАЗМЕРУ устройства; на реальном USB-накопителе авто-выбор даст FAT32, то есть -c в конкретном стеме тоже приведёт к FAT32. Формально вопрос корректен (стем требует FAT32 «независимо от размера», а это гарантирует только явный -F 32), но обоснование в explanation звучит как «тип будет выбран автоматически по размеру раздела, а не гарантированно FAT32» и может читаться как логический скачок. Рекомендация (не блокер): усилить формулировку explanation до «без -F тип выбирается автоматически по размеру устройства, поэтому FAT32 не гарантирован»."
  - question_id: fs_011
    verdict: accept
    passes:
      fact_check: pass
      objective: pass
      language: pass
      beginner_view: pass
      skeptic_view: pass
    hard_blocker_reason: null
    issues:
      - "Advisory MINOR (skeptic-view): fs_011~fs_003 (cos 0.7454 в forward-прогоне) — самая близкая не-блокирующая связь по теме. Задача и набор вариантов разные (fs_003: 'mount -t nfs', fs_011: 'showmount -e'), стемы различаются по смыслу (монтирование vs запрос списка экспортов), поэтому дублем не является; значение лежит ниже fail-порога 0.80 и ниже intra-warn 0.75."
  - question_id: fs_012
    verdict: accept
    passes:
      fact_check: pass
      objective: pass
      language: pass
      beginner_view: pass
      skeptic_view: pass
    hard_blocker_reason: null
    issues:
      - "Advisory MINOR (beginner-view): дистрактор 'mount -t loop' использует несуществующий тип ФС; в реальной практике имена типов при опечатке могут разрешаться в модуль ядра, поэтому для экзаменуемого сигнал чуть слабее, чем в stеме заявлено. На корректность не влияет: 'loop' — опция монтирования (man mount, монтирование файла-образа), а не тип ФС, и содержимое ISO в /mnt/iso такой вызов не предоставит."
      - "Advisory MINOR (ratio-диагностика): по СЛОВАМ классификатор tools/_lib/ratio.cjs даёт mixed 1.667 > 1.5 (опции 5/5/5/3 слова). Это НЕ нарушение: qc.cjs вызывает checkRatio с unit='chars' (ratio 1.188, verdict ok). Словесная шкала в банке не является гейтом (см. комментарии ratio.cjs/qc.cjs)."
  - question_id: fs_013
    verdict: accept
    passes:
      fact_check: pass
      objective: pass
      language: pass
      beginner_view: pass
      skeptic_view: pass
    hard_blocker_reason: null
    issues:
      - "Advisory MINOR (skeptic-view): fs_013~fs_006 cos 0.7896 и fs_013~ls_007 cos 0.7656 — выше intra-warn 0.75, ниже fail 0.80. При ручном разборе дубля нет: fs_006 — про запуск fsck на подозреваемом разделе, fs_013 — про установку порогов автоматической проверки; наборы вариантов не пересекаются. Класс «topically related but distinct», прямо описанный в tools/cosine-calibration.json (caveat: модель английская, шкала на русском сжата)."
  - question_id: fs_014
    verdict: accept
    passes:
      fact_check: pass
      objective: pass
      language: pass
      beginner_view: pass
      skeptic_view: pass
    hard_blocker_reason: null
    issues:
      - "RESOLVED CRITICAL (skeptic-view, ре-аудит после правки стема): коллизия fs_014~ls_005 закрыта. Было: forward-гейт exit code 1, REJECT fs_014, bank cos=0.8049 vs ls_005 (local_storage.json, 'mount / findmnt: текущие опции монтирования') при пороге 0.80. Стало (мой повторный прогон на обновлённом стеме): forward-гейт exit code 0, rejected 0/6, fs_014 bank cos=0.6090 vs ls_002, drafts cos=0.5797 vs ls_004; косинус до ls_005 упал до 0.5275. Разведение достигнуто формулировкой: сменены каркас стема (ошибка «No space left on device» при записи множества мелких файлов) и точка монтирования (/data -> /srv/mail), поэтому перестал совпадать сигнал 'раздел /data + нужно проверить + какая команда покажет'. Пара разведена честной правкой контента, а не через known_exceptions — whitelist и tools/cosine-calibration.json не трогались."
      - "Проверка остаточных пересечений на новом стеме (мои измерения): fs_014 vs ls_005=0.5275, ls_002=0.6090, ls_004=0.5797, fs_006=0.5049, ls_007=0.4925, pm_014=0.4917, rs_001=0.4783, fs_005=0.4703, fs_003=0.3870, pm_010=0.2250; jaccard стемов ≈0.0000-0.0213 (порог 0.9). TOP6 по всему банку: ls_002 0.6090, ds_013 0.5843, ls_004 0.5797, ds_011 0.5690, fp_014 0.5646, pm_016 0.5625 — ни одной пары > 0.80, ни одной > 0.75. Содержательного клона нет: ls_002 — это LVM/lvextend+xfs_growfs (совпадение только по подстроке '/data' в имени тома /dev/data/lv_app и общему каркасу про ФС), ls_005 — источник и опции монтирования (findmnt -T), fs_006 — запуск fsck; задачи и наборы опций не пересекаются."
      - "Advisory MINOR (beginner-view): новый стем понятен и диагностически каноничен — ошибка «No space left on device» при записи МНОЖЕСТВА МЕЛКИХ файлов при достаточном свободном месте по df -h является классическим признаком исчерпания инодов, и стем прямо это оговаривает. Остаточная придирка: df -h показал место ДО ошибки, а df -i в верном варианте вызывается с путём /srv/mail — если /srv/mail лежит на той же ФС, что и проверяемый раздел (в стеме это подразумевается), команда корректна; явного указания на отдельную ФС в стеме нет, но оно и не требуется, так как df -i печатает строку именно для ФС, содержащей указанный путь."
