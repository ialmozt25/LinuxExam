  Goal invariant в смысле контракта qc_to_orchestrator и в том же смысле, в
  котором его ставил QC батча 3 — «ноль дублей, тема канона, структура чистая»
  — ВЫПОЛНЕН: дублей нет ни внутри партии (intra max 0.6674), ни с банком 183
  (bank max 0.7539, пар > 0.80 ноль), ни с avoid-list, ни в forbidden
  cross-topics; exact-dup текстов опций и верных ответов — 0. При этом
  goal_invariant_check НЕ означает «гейты зелёные»: гейт `npm run qc` по
  зеркалу 189 красный из-за fm_016 (Fails 1), и именно поэтому verdict FAIL.
  Чтобы не путать эти две вещи, gate-статус вынесен в verdict/verdict_basis и
  в ratio_rerun.rows[fm_016].
