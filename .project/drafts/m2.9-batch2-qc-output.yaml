    - "systemctl(1) / список команд — подкоманды activate нет (есть start, stop, restart, reload, try-restart, enable, disable, reenable, preset, mask, unmask, isolate, kill, status, show, cat, edit, revert, get-default, set-default, rescue, emergency и др.). Вывод: дистрактор systemctl activate невалиден (ошибка разбора команды), как и заявлено в evidence Writer."
    - "systemctl(1) / mask — «Masks one or more units, making it impossible to start them» (юнит связывается с /dev/null), попытка запуска даёт «Unit legacy.service is masked»; disable убирает только симлинки автозапуска, ручной start остаётся возможным. Подкоманды hide нет. Вывод: ds_010 верен, все три дистрактора объективно неверны (stop — только остановка текущего процесса)."
    - "systemctl(1) / set-default, get-default, isolate — set-default задаёт цель загрузки по умолчанию (симлинк /etc/systemd/system/default.target); get-default только печатает текущую цель; isolate запускает юнит и его зависимости, останавливая остальные, то есть переключает систему сейчас и цель по умолчанию не меняет. Вывод: ds_011 верен, дистракторы неверны."
    - "systemctl(1) + systemd.special(7) / enable на target — графический target не имеет секции [Install] (Requires=multi-user.target, Wants=display-manager.service, Conflicts=rescue.service rescue.target, After=…, AllowIsolate=yes), поэтому systemctl enable graphical.target завершается сообщением об отсутствии installation config и ненулевым кодом, а default.target в любом случае не переопределяет. Вывод: дистрактор неверен, ответ ds_011 не затронут; формулировка пояснения «Команда enable включает target» неточна (advisory). Остаточная неопределённость: машинная сверка недоступна, вывод по знанию unit-файла RHEL 9 / systemd 252."
    - "journalctl(1) / -p, --priority= — «Show only messages with the specified priority … a single log level is interpreted as the specified level and all higher (more important) levels»; шкала 0..7 (emerg, alert, crit, err, warning, notice, info, debug). Вывод: -p err отбирает err, crit, alert, emerg — ds_012 верен; -p info добавляет info, notice, warning и потому требованию «только err и выше» не удовлетворяет."
