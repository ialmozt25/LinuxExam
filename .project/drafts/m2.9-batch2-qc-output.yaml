    - "systemd-analyze(1) / blame — «Prints a list of all units, sorted by the time they took to initialize when the system was booted up, with the units that took the longest first». time — суммарное время этапов (firmware, loader, kernel, initrd, userspace); critical-chain — цепочка юнитов на критическом пути; plot — SVG-график загрузки. Вывод: ds_013 верен, все три дистрактора неверны; уточнение про plot — в issues."
    - "crontab(5) (cronie, RHEL 9) / спецстроки — «Instead of the first five fields, one of eight special strings may appear»: @reboot (Run once, at startup), @yearly, @annually, @monthly, @weekly, @daily, @midnight (same as @daily), @hourly. Вывод: ds_014 верен (@reboot), токен @startup не существует, @daily (0 0 * * *) и @hourly (0 * * * *) задают расписание, а не загрузку. Неточность пояснения про «семь» токенов и про «момент запуска cron» — в issues (advisory)."
    - "ОГРАНИЧЕНИЕ МЕТОДА: web_fetch в этой среде недоступен (man7.org, freedesktop.org, manpages.debian.org, manpages.ubuntu.com, raw.githubusercontent.com дают «resolves to a non-public IP address»), web_search отдаёт только список ссылок без текста страниц. Поэтому man-верификация выполнена по знанию man-страниц RHEL/Rocky 9 (systemd 252, cronie 1.5), а не машинной сверкой текста; WSL и live-прогоны команд RHCSA запрещены капитаном и не выполнялись. Остаточная неопределённость помечена в тех пунктах, где она есть (enable на target без [Install], трактовка позиционного аргумента journalctl, дефолт вывода systemd-analyze plot, точная редакция RHEL crontab(5))."

