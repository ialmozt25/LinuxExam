## Твоя задача

Сгенерировать **РОВНО 6** MCQ-вопросов `fm_013`..`fm_018` по теме `file_management`
строго по этому контракту и сохранить результат в
`.project/drafts/m2.9-batch4-writer-output.yaml`.

**Ты НЕ трогаешь** `src/data/questions/*.json` — интеграцию делает Оркестратор
после QC и approve капитана. Твой единственный выходной файл —
`.project/drafts/m2.9-batch4-writer-output.yaml`.

## Обязательные проверки перед сдачей (все — блокеры)

Из корня `C:\Users\Alexey Udotov\LinuxExam`.

**ВАЖНО про входной формат инструментов:** `tools/cosine.cjs` парсит только **JSON**
(`JSON.parse`), YAML он не читает. Поэтому сначала создай черновой pending-файл
**`$env:TEMP\fm-batch4-pending.json`** — обычный JSON-массив из 6 объектов в формате
банка (`bank_format`). Только на нём гоняются cosine-проверки. Итоговый YAML
`m2.9-batch4-writer-output.yaml` пишешь отдельно, с теми же 6 вопросами.
Временный pending JSON можно оставить в `$env:TEMP` (в репо его коммитить не нужно).

1. `node tools/cosine.cjs --intra-batch "$env:TEMP\fm-batch4-pending.json"`
   — максимальная cosine между вопросами партии должна быть **≤ 0.85**
   (жёстче, чем 0.8 в batch 3: это прямое требование критериев приёмки spec 001).
   Инструмент считает cosine по тексту `question` (стем), не по опциям.
2. `node tools/cosine.cjs "$env:TEMP\fm-batch4-pending.json"`
   — cosine каждого нового вопроса против **всего банка 183** ≤ **0.85**.
   Этот режим читает банк с диска и сравнивает с pending — **интеграция не нужна**.
   Кросс-тема особенно опасна с `ls_*`, `fs_*`, `et_*`.
   Прогон поднимает локальную модель эмбеддингов и может занять несколько минут.

3. `npm run qc` — **ПРОПУСТИ**. Подтверждено Оркестратором: `tools/qc.cjs` не
   принимает аргументов и всегда проверяет **весь банк** из `src/data/questions/`
   (известный баг: `--batch` молча игнорируется). Прогнать qc по кандидатам до
   интеграции невозможно, а банк править тебе запрещено. Вместо этого сверь
   руками и приведи числа по каждому вопросу:
   - ровно 4 опции и ровно один `correct: true`;
   - `ratio` длин опций (самая длинная / самая короткая) ≤ **1.5**;
   - длина `explanation` 200–500 символов и не более 3 строк;
   - `objective_domain` — одна цифра;
   реальный `npm run qc` по банку Оркестратор выполнит сам на этапе интеграции.

4. Остаточную неопределённость (ключ существует в RHEL 9 / не существует)
   перечисли явно в `evidence.notes` и в `notes`.

Приведи в `evidence` точные команды и фактические числа. Без этого QC вернёт FAIL.

