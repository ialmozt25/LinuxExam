  - question_id: fs_014
    reference: "man df"
    note: "df(1): -i показывает иноды, -h — место в человекочитаемом виде, -T — тип ФС; du -sh считает занятое место каталога. Все варианты — реальные ключи, ошибка только в их назначении."
