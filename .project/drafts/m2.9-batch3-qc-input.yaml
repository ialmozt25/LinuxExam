qc_mandatory_checks:
  - "FACT-CHECK: по каждому вопросу проверить каждую из 4 опций. Верный вариант должен быть объективно верен по man-странице RHEL/Rocky 9 (fuser(1), mkfs.vfat(8)/mkfs.fat(8), showmount(8), mount(8), tune2fs(8), df(1), umount(8), lsof(8)), каждый дистрактор — объективно неверен. Всё, что можно, сверять независимо; отдельно проверить дистракторы на «второй верный вариант» (например, не показывает ли PID-ы и другой вариант, и не является ли близкая опция тоже правильной)."
  - "OBJECTIVE: ровно один объективно верный вариант в каждом вопросе; наличие второго верного = CRITICAL hard blocker."
  - "DEDUP / COSINE: (a) обязательный прогон node tools/cosine.cjs --intra-batch src/data/questions/file_systems.json — ВАЖНО: батч в банк ещё НЕ интегрирован, поэтому этот прогон покрывает только 8 существующих вопросов темы и НЕ проверяет новые fs_009..fs_014 (это известная ловушка, из-за неё в батче 2 дубль ds_014 был найден только вручную). (b) Поэтому QC ОБЯЗАН дополнительно положить 6 новых вопросов отдельным JSON-файлом в %TEMP% и прогнать два режима: node tools/cosine.cjs --intra-batch <temp.json> (дубли внутри батча) и node tools/cosine.cjs <temp.json> (forward-проверка против bank=177 и drafts). Привести exit code, max cosine, число пар > 0.8 и id ближайших совпадений."
  - "Смысловые дубли с существующим банком проверить также вручную, не только авто-метрикой: сверить с fs_001..fs_008 (mkfs.xfs, поля dump/fsck pass в fstab, mount -t nfs, CIFS, tune2fs -L, fsck.ext4, remount,rw, autofs) и с занятыми аспектами смежных тем local_storage (ls_002 xfs_growfs, ls_003 mkswap, ls_004 fstab по UUID, ls_005 mount/findmnt, ls_006 sfdisk GPT, ls_007 lsblk/blkid, ls_008 fstab/mount -a/nofail), а также с avoid-list батча 2 (ds_002, ds_014, rs_001, pm_014, pm_010). Авто-метрика cosine видит только стемы: почти-клон с одинаковым набором вариантов может пройти ниже порога 0.8."
  - "RATIFICATION BY RE-EXECUTION: QC сам запускает и приводит коды возврата: npm run qc (ожидай Total 177, Fails 0 — это baseline ДО интеграции), npm run shuffle-bank:check (ожидай BANK 177), npm run typecheck, node tools/cosine.cjs --intra-batch src/data/questions/file_systems.json."
  - "ФОРМАТ: 4 опции, ровно одно correct: true, непустой explanation (200-500 символов), _meta.reference вида man <cmd>, id по regex ^fs_\\d{3}$ и строго в диапазоне fs_009..fs_014. Распределение позиций correct посчитать САМОМУ по факту (не доверять position_report Writer) и проверить: после +6 ни одна позиция темы не превышает 60% (ожидание: батч 2/1/1/2, тема после интеграции 5/4/3/2 из 14). Дополнительно проверить, что длина опций не нарушает гейт tools/_lib/ratio.cjs (mixed: max/min <= 1.5 — иначе npm run qc даст FAIL)."
verdict_rules:
  - hard blocker ставится ТОЛЬКО по проходам fact-check и objective
  - per-question reject — только при hard blocker; reject без hard_blocker_reason запрещён
  - language / beginner-view / skeptic-view — advisory (MINOR/SUBSTANTIAL), не блокируют
  - агрегатный verdict = PASS, если hard blocker-ов нет ни у одного вопроса
  - дубль, найденный cosine-гейтом, оформлять как CRITICAL/SUBSTANTIAL по skeptic-view с явной пометкой, что он нарушает goal invariant («ноль дублей»), даже если формально не является hard blocker
