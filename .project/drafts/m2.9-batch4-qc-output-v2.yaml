contract: qc_to_orchestrator
batch_id: m2.9-batch4-file_management
verdict: PASS
per_question:
  - question_id: fm_013
    verdict: accept
    reason: "rsync -a --delete src/ dst/ — единственный вариант, удаляющий из приёмника файлы, отсутствующие в источнике. Дистракторы --update / --existing / --backup существуют в rsync 3.2.3 (RHEL 9) и объективно не дают зеркала: --update лишь пропускает более новые файлы на приёмнике, --existing не создаёт новых файлов на приёмнике, --backup переименовывает заменяемые файлы. Второго верного ответа нет. ratio 1.0741 (класс sentences, порог 1.30) — ok."
  - question_id: fm_014
    verdict: accept
    reason: "dd if=/dev/zero of=disk.img bs=1M count=100 действительно создаёт 100 МБ нулей (bs задаёт размер блока, count — число блоков). Дистракторы неверны: if=/dev/null не выдаёт данных (файл 0 байт), bs=1K count=100 даёт 100 КБ, операнда size= у GNU dd нет (подтверждено: в dd --help coreutils 8.32 присутствуют bs=, count=, if=, of=, size= отсутствует). ratio 1.0238 (sentences/1.30) — ok."
  - question_id: fm_015
    verdict: accept
    reason: "split -b 10M data.log — единственный вариант с корректным ключом размера части. -l 10M неверен (-l принимает число строк, суффикс M некорректен), -n 10M неверен (-n принимает число частей). Утверждение explanation «Опции -c в GNU split нет» я перепроверил сам: в GNU coreutils 8.32 (версия RHEL 9) короткий ключ -c у split не зарегистрирован (существует только -C, --line-bytes=SIZE), поэтому команда split -c 10M ... завершится ошибкой «invalid option». Дистрактор неверен, второй верный ответ не появился. ratio 1.0000 (sentences/1.30) — ok."
  - question_id: fm_016
    verdict: accept
    reason: "Верный ответ truncate -s 0 data.log обнуляет файл, сохраняя inode. Новый дистрактор rm --force -- data.log — валидный GNU-синтаксис (--force = длинная форма -f, -- закрывает разбор опций, далее операнды-файлы) и по-прежнему объективно неверен: rm удаляет файл, нарушая условие «не удаляя его». Вторым верным ответом не стал. ratio после правки 1.2000 (класс sentences, порог 1.30, warn 1.25 — ниже warn-порога), hard blocker раунда 1 закрыт (было 1.4118)."
  - question_id: fm_017
    verdict: accept
    reason: "mktemp -d /tmp/tmp.XXXXXX — единственный вариант, создающий именно каталог со случайным суффиксом. Без -d mktemp создаёт файл; mktemp -p /tmp tmp.XXXXXX без -d тоже создаёт файл (ключ -p лишь задаёт базовый каталог); mkdir -m 700 /tmp/tmp.$$ использует PID и не защищён от коллизий. ratio 1.1364 (mixed/1.50) — ok."
  - question_id: fm_018
    verdict: accept
    reason: "basename /etc/ssh/sshd_config возвращает последний компонент пути (имя файла). dirname вернёт /etc/ssh, realpath — полный канонический путь, readlink без -f на обычном файле ничего не выведет. Все четыре команды существуют в coreutils 8.32, несуществующих ключей нет. ratio 1.0357 (token/2.0) — ok."
issues:
  - question_id: fm_016
    severity: MINOR
    pass: objective
    description: "Дистрактор `rm --force -- data.log` корректен с точки зрения GNU-синтаксиса, но использование длинной формы --force для двухсимвольного -f нетипично для реальной практики и делает вариант заметно более «многословным», чем остальные. Это не дефект: option ratio 1.2000 ниже warn-порога 1.25, смысловой ловушки не создаёт (rm всё равно удаляет файл). Правок не требуется, фиксируется как наблюдение."
  - question_id: fm_014
    severity: MINOR
    pass: fact-check
    description: "Дистрактор `dd ... bs=1M size=100` построен на несуществующем операнде size=. Операнд действительно не существует в GNU dd (coreutils 8.32), но такие «синтетические» несуществующие операнды — слабый тип дистрактора: внимательный студент отбрасывает его не по знанию материала, а по общему знакомству с синтаксисом dd. Рекомендация на будущее (не блокер для этого батча): отдавать предпочтение синтаксически валидным, но неверным по семантике вариантам, как это сделано в fm_016."
  - question_id: fm_015
    severity: MINOR
    pass: fact-check
    description: "Дистрактор `split -c 10M data.log` также опирается на отсутствующий короткий ключ -c. Утверждение explanation проверено и ВЕРНО для версии RHEL/Rocky 9 (coreutils 8.32): зарегистрирован только -C (--line-bytes). Слабость та же, что у fm_014 — тип дистрактора «несуществующий ключ»."
  - question_id: fm_013
    severity: MINOR
    pass: skeptic-view
    description: "Формулировка «синхронизирует содержимое каталога src/ в dst/, удаляя из dst/ файлы, которых больше нет в src/» однозначна, но требует неявного знания, что завершающий слэш у источника означает «копировать содержимое, а не сам каталог». При чтении без этого знания вариант-ответ всё равно остаётся единственным с ключом --delete, поэтому неоднозначности нет. Замечание адвайзорное."
