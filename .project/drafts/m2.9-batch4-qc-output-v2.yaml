goal_invariant_check: true
notes: >-
  ВЕРДИКТ PASS. Hard blockers (проходы fact-check и objective) отсутствуют; ни один вопрос не отклонён.
  Зеркало банка 189 через НАСТОЯЩИЙ tools/qc.cjs (подменены только BANK_DIR/TOPICS во временной копии инструмента): Fails 0, Warns 16, exit 0 — требование выполнено.
  Baseline репозитория 183 воспроизведён независимо: Fails 0, Warns 16, exit 0. Множества warn-строк совпадают побайтно, новых warn-категорий батч не добавляет.

  ДЕЛЬТА v1 -> v2 подтверждена машинно (diff двух снапшотов): изменилась РОВНО одна содержательная строка — дистрактор fm_016 `rm -f -- data.log` -> `rm --force -- data.log`.
  Стемы, верный ответ (truncate -s 0 data.log, позиция 3) и explanation fm_016 не менялись; пять прочих вопросов (fm_013, fm_014, fm_015, fm_017, fm_018) идентичны по всем полям (topic, difficulty, objective_domain, subtopic, question, explanation, все 4 опции и флаги correct).
  Прочие различия файлов — только служебные поля (добавлены qc_round: 2 и prior_round, обновлена версия note об rm в блоке evidence). Hard blocker раунда 1 закрыт: ratio fm_016 1.4118 -> 1.2000 при пороге 1.30.
  Новый дистрактор `rm --force -- data.log` — валидный GNU-синтаксис (--force = длинная форма -f; `--` завершает разбор опций, поэтому `data.log` трактуется как операнд-файл), он по-прежнему объективно НЕВЕРЕН для условия «не удаляя файл» и вторым верным ответом не стал. Класс опций остался sentences (4/4/4/4 слова), гейт пройден и по FAIL-порогу 1.30, и по warn-порогу 1.25.

  Независимо перепроверено (не по выводам раунда 1): структурная схема всех 6 вопросов; ratio тем же кодом; cosine в обоих режимах своими прогонами; существование/отсутствие ключей и операндов; отсутствие смысловых дублей внутри партии и с банком; отсутствие незаявленных несуществующих ключей; соблюдение avoid-list и forbidden_cross_topic_aspects.
  avoid-list: ни один из 11 ID (ds_002, ds_014, rs_001, pm_014, pm_010, fs_005, fs_006, fs_013, ls_002, ls_005, ls_007) не повторён в партии; ds_014 в банке отсутствует — намеренный no-op, подтверждено. Существующие подтемы fm_001..fm_012 не дублируются: rsync, dd, split, truncate, mktemp, basename/dirname в банке file_management новы.
  Запрещённые cross-topic аспекты не затронуты: нет tar/find/sed/awk/chmod/LVM/mount/fstab и т.п.; все шесть вопросов лежат в предметном поле file_management.

  ЧТО ПРОВЕРИТЬ НЕ СМОГ (остаточная неопределённость): (1) факты сверены по знанию man-страниц/текстов справок GNU coreutils 8.32 и rsync 3.2.3, но НИ ОДНА команда не исполнялась на RHEL/Rocky 9 — live-прогоны запрещены капитаном; в частности поведение `rm --force -- file` и вывод `split`/`readlink` на обычном файле подтверждены документально, а не экспериментом на целевом хосте; (2) версия rsync на конкретной целевой системе принята как 3.2.3 (RHEL 9); при иной сборке набор длинных ключей rsync может отличаться, хотя все четыре использованных ключа есть в upstream rsync уже много лет; (3) `npm run shuffle-bank:check` (второй гейт из DOD.md, раздел content) не запускался: он относится к интеграции банка, а не к замороженному снапшоту — Оркестратору следует прогнать его после вставки fm_013..fm_018 в src/data/questions/file_management.json (порядок вопросов в файле сохранить как в снапшоте, _order.json — дописать id в конец, _topics.json — total 189 / file_management 18); (4) визуальная проверка UI-рендеринга опций не выполнялась (вне рамок контракта QC).

  ПРАВКИ В РЕПОЗИТОРИИ НЕ ВНОСИЛИСЬ: src/data/questions/* (183 / file_management 12 / fm_013..fm_018 отсутствуют), tools/* и любые другие файлы проекта оставлены без изменений; всё зеркало и вспомогательные скрипты — в $env:TEMP\qc29b4\. Создан ровно один файл результата: .project/drafts/m2.9-batch4-qc-output-v2.yaml.
