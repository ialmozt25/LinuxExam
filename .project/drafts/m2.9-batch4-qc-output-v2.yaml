  man_recheck:
    - "rsync (RHEL 9: rsync 3.2.3, man rsync): --delete удаляет из приёмника файлы, отсутствующие в источнике; -u/--update пропускает файлы новее на приёмнике; --existing/--ignore-non-existing не создаёт новые файлы на приёмнике; -b/--backup переименовывает заменяемые файлы. Ключи существуют, несуществующих нет. Верный ответ валиден; завершающий слэш у src/ означает «содержимое каталога»."
    - "dd (coreutils 8.32): bs= / count= / if= / of= — существуют, операнд size= ОТСУТСТВУЕТ (проверено по тексту справки dd 8.32: перечислены bs=, count=, if=, of=; size= отсутствует). Чтение из /dev/null не выдаёт данных; bs=1K count=100 = 100 КБ."
    - "split (coreutils 8.32): -b/--bytes=SIZE, -l/--lines=NUMBER, -n/--number=CHUNKS существуют; короткого ключа -c НЕТ (зарегистрирован только -C/--line-bytes=SIZE), поэтому split -c ... даёт «invalid option» и утверждение explanation корректно. Проверено по тексту справки coreutils 8.32; на RHEL-хосте не исполнялось (live-прогоны запрещены капитаном)."
    - "truncate (coreutils 8.32): -s/--size=SIZE существует; -s 0 задаёт нулевой размер, сохраняя inode; -s 100 оставляет 100 байт. Длинной формы или иной записи, обнуляющей файл без удаления, среди дистракторов нет."
    - "touch (coreutils 8.32): -c/--no-create и -m (change only the modification time) существуют; вместе они лишь обновляют mtime и не меняют содержимое — дистрактор верно помечен неверным."
    - "rm (coreutils 8.32): -f/--force существует («ignore nonexistent files and arguments, never prompt»); -- является стандартным маркером конца опций, после него аргументы трактуются как операнды. `rm --force -- data.log` синтаксически валиден и удаляет файл — по-прежнему неверен для условия «не удаляя его»."
    - "mktemp (coreutils 8.32): -d создаёт каталог, -p DIR задаёт базовый каталог, XXXXXX заменяется случайными символами. Без -d создаётся файл (в т.ч. с -p). $$ в bash подставляет PID; mkdir -m 700 /tmp/tmp.$$ завершится ошибкой при существующем каталоге и не является безопасным способом."
    - "basename/dirname (coreutils 8.32): basename отбрасывает каталог и возвращает последний компонент пути; dirname возвращает каталог. readlink (coreutils 8.32) по умолчанию печатает цель символьной ссылки; для обычного файла без -f вывода нет. realpath печатает канонический абсолютный путь. Все команды существуют."
    - "Незаявленных несуществующих ключей/операндов не найдено: помимо заявленных Writer'ом size= (dd) и -c (split), остальные опции дистракторов и верных ответов (rsync -a/--delete/--update/--existing/--backup; truncate -s; touch -c -m; mktemp -d/-p; basename; dirname; realpath; readlink) реально существуют в RHEL 9."
