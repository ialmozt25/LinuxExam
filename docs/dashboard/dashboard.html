<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="LinuxExam — Центр Управления: прогресс банка вопросов, статусы milestones, гейты и открытые проблемы.">
    <title>LinuxExam — Центр Управления</title>
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>
    <header class="dashboard-header">
      <div>
        <h1 class="dashboard-title">LinuxExam — Центр Управления</h1>
        <p class="dashboard-subtitle">Обновлено: <span id="last-update" class="mono">—</span></p>
        <p class="dashboard-subtitle">
          <span id="last-updated-ago">—</span>
          <button id="refresh-btn" type="button" class="btn">Обновить</button>
        </p>
      </div>
    </header>
    <section id="hero" class="hero">
      <h2 class="hero__title">Где мы сейчас</h2>
      <dl class="hero__grid">
        <dt>Milestone</dt><dd id="hero-milestone">—</dd>
        <dt>Последний</dt><dd id="hero-last-commit">—</dd>
        <dt>Следующий</dt><dd id="hero-next">—</dd>
      </dl>
    </section>
    <main id="dashboard" class="dashboard"></main>
    <noscript class="dashboard-subtitle">Для работы Центра Управления нужен JavaScript.</noscript>
    <script src="dashboard.js" defer></script>
  </body>
</html>
