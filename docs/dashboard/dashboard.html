<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lx-theme');
          if (t !== 'light' && t !== 'dark') {
            t = (window.matchMedia &&
                 window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (err) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="LinuxExam — Центр Управления: прогресс банка вопросов, статусы milestones, гейты и открытые проблемы.">
    <title>LinuxExam — Центр Управления</title>
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>
    <header class="dashboard-header">
      <div class="dashboard-header__left">
        <h1 class="dashboard-title">LinuxExam — Центр Управления</h1>
        <p class="dashboard-subtitle">Обновлено: <span id="last-update">—</span></p>
      </div>
      <div class="dashboard-header__right">
        <button id="refresh-btn" type="button" class="btn">Обновить</button>
        <button id="theme-btn" type="button" class="theme-toggle" aria-label="Переключить тему">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </header>
    <main id="dashboard" class="dashboard"></main>
    <noscript class="dashboard-subtitle">Для работы Центра Управления нужен JavaScript.</noscript>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
