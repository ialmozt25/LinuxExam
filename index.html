<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Declares both schemes so native controls match the active theme. -->
    <meta name="color-scheme" content="light dark" />
    <!-- FOUC prevention: resolves data-theme before the CSS/JS bundle loads. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          // Storage format: key ABSENT (or the legacy 'system') means inherit;
          // 'light' / 'dark' mean an explicit manual choice. This script does NOT
          // migrate storage - React is not loaded yet; migrateThemeStorage() in
          // main.tsx does that synchronously right after.
          var saved = localStorage.getItem('lx-theme');
          var scheme;
          if (saved === 'light' || saved === 'dark') {
            root.setAttribute('data-theme-source', 'manual');
            root.setAttribute('data-theme', saved);
            return;
          }
          // Inherit: let the live Telegram palette through and follow the client
          // colour scheme when it is already available, otherwise the OS one.
          root.setAttribute('data-theme-source', 'inherit');
          scheme =
            (window.Telegram &&
              window.Telegram.WebApp &&
              window.Telegram.WebApp.colorScheme) ||
            (window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light');
          root.setAttribute('data-theme', scheme === 'light' ? 'light' : 'dark');
        } catch (e) {
          root.setAttribute('data-theme', 'dark');
          root.setAttribute('data-theme-source', 'inherit');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LinuxExam — Linux certification prep" />
    <meta property="og:description" content="Тренажёр для подготовки к Linux-сертификации: вопросы, объяснения, режим экзамена" />
    <meta property="og:url" content="https://ialmozt25.github.io/LinuxExam/" />
    <meta property="og:image" content="https://ialmozt25.github.io/LinuxExam/og-image.svg" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="360" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinuxExam — Linux certification prep" />
    <meta name="twitter:description" content="Тренажёр для подготовки к Linux-сертификации" />
    <meta name="twitter:image" content="https://ialmozt25.github.io/LinuxExam/og-image.svg" />
    <title>LinuxExam — Linux certification prep</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
