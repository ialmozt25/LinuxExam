<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Declares both schemes so native controls match the active theme. -->
    <meta name="color-scheme" content="light dark" />
    <!-- FOUC prevention: resolves data-theme before the CSS/JS bundle loads. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var saved = localStorage.getItem('lx-theme');
          if (saved === 'system') {
            // Following the client/system: let the live Telegram palette through.
            root.setAttribute('data-theme-source', 'inherit');
            var scheme =
              (window.Telegram &&
                window.Telegram.WebApp &&
                window.Telegram.WebApp.colorScheme) ||
              (window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
            root.setAttribute('data-theme', scheme === 'light' ? 'light' : 'dark');
            return;
          }
          var theme = saved === 'light' || saved === 'dark' ? saved : null;
          if (theme === null) {
            theme =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
            root.setAttribute('data-theme-source', 'inherit');
          } else {
            root.setAttribute('data-theme-source', 'manual');
          }
          root.setAttribute('data-theme', theme);
        } catch (e) {
          root.setAttribute('data-theme', 'dark');
          root.setAttribute('data-theme-source', 'inherit');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
